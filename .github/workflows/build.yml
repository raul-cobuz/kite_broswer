name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            python3

      - name: Build
        run: make

      - name: Build debug
        run: make debug

      - name: Run tests
        run: make test

      - name: Generate ad-block filters
        run: make filters

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mybrowser
          path: mybrowser
          if-no-files-found: error
